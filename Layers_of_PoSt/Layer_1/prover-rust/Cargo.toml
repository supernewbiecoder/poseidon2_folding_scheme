[package]
name = "prover-rust"
version = "0.1.0"
edition = "2021"
description = "Off-chain Nova Folding & Spartan Compression for Engram PoSt"

[dependencies]
nova-snark = "0.24.0"
bellpepper-core = "0.2.0"  # ĐÃ SỬA VỀ 0.2.0 ĐỂ KHỚP VỚI NOVA
pasta_curves = "0.5.0"
ff = "0.13.0"
rand = "0.8.5"
configparser = "3.0.0" 
rand_chacha = "0.3.1"
lazy_static = "1.4.0"
hex = "0.4.3"
bincode = "1.3.3"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0.81"
sha2 = "0.10.8"
engram_common = { path = "../../engram_common" }  # TỪ prover-rust LÊN 2 CẤP
